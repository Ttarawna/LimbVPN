name: Android APK

on:
  workflow_dispatch:
    inputs:
      mihomo_ref:
        description: "Версия Mihomo (тег). Пусто означает последнюю стабильную"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Клонируем Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.mihomo_ref }}
        run: |
          set -e
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          fi
          echo "Версия Mihomo: $REF"
          git clone --depth 1 --branch "$REF" https://github.com/MetaCubeX/mihomo.git mihomo
          grep -rqi mieru mihomo/adapter/outbound || { echo "В этой версии Mihomo нет mieru"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: mihomo/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создаём Android-проект и дорабатываем его
        run: |
          set -e
          flutter create . --platforms=android --org dev.quiet --project-name quiet_vpn
          python3 tools/patch_android.py

      - name: Скачиваем списки российских адресов
        run: |
          set -e
          D=android/app/src/main/assets/geo
          BASE=https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
          curl -fL -o $D/geoip.dat $BASE/geoip.dat
          curl -fL -o $D/geosite.dat $BASE/geosite.dat
          ls -la $D

      - name: Собираем ядро (Go в aar)
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cp -r core mihomo/quietcore
          cd mihomo
          go get golang.org/x/mobile/bind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile bind -v -target=android/arm64 -androidapi 24 \
            -tags with_gvisor -trimpath \
            -ldflags="-s -w -checklinkname=0" \
            -o "$GITHUB_WORKSPACE/android/app/libs/quietcore.aar" ./quietcore

      - name: Проверки и сборка APK
        run: |
          set -e
          flutter pub get
          flutter test test/core_test.dart
          flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
