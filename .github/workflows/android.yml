name: Android APK

on:
  workflow_dispatch:
    inputs:
      mihomo_ref:
        description: "Версия Mihomo (тег). Пусто означает последнюю стабильную"
        required: false
        default: ""
      publish:
        description: "Опубликовать релиз для автообновления приложения"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Клонируем Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.mihomo_ref }}
        run: |
          set -e
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          fi
          echo "Версия Mihomo: $REF"
          git clone --depth 1 --branch "$REF" https://github.com/MetaCubeX/mihomo.git mihomo
          grep -rqi mieru mihomo/adapter/outbound || { echo "В этой версии Mihomo нет mieru"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: mihomo/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ключ подписи
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/limb.p12"
            echo "LIMB_KEYSTORE=$RUNNER_TEMP/limb.p12" >> "$GITHUB_ENV"
            echo "LIMB_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ"
          else
            echo "::warning::Ключ подписи не задан. APK подписан временным ключом, обновление поверх установленной версии работать не будет, релиз не публикуется."
          fi

      - name: Создаём Android-проект и дорабатываем его
        run: |
          set -e
          flutter create . --platforms=android --org dev.quiet --project-name quiet_vpn
          python3 tools/patch_android.py

      - name: Скачиваем списки российских адресов
        run: |
          set -e
          D=android/app/src/main/assets/geo
          BASE=https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
          curl -fL -o $D/geoip.dat $BASE/geoip.dat
          curl -fL -o $D/geosite.dat $BASE/geosite.dat
          ls -la $D

      - name: Собираем ядро (Go в aar)
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cp -r core mihomo/quietcore
          cd mihomo
          python3 "$GITHUB_WORKSPACE/tools/patch_sing_tun.py"
          go get golang.org/x/mobile/bind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile bind -v -target=android/arm64 -androidapi 24 \
            -tags with_gvisor -trimpath \
            -ldflags="-s -w -checklinkname=0" \
            -o "$GITHUB_WORKSPACE/android/app/libs/quietcore.aar" ./quietcore

      - name: Проверки и сборка APK
        run: |
          set -e
          flutter pub get
          flutter test test/core_test.dart test/updater_test.dart test/vpn_service_manager_test.dart test/app_state_test.dart test/home_page_test.dart
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Подпись APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256 digest" || true

      - uses: actions/upload-artifact@v4
        with:
          name: limb-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Публикуем релиз для автообновления
        if: ${{ github.event.inputs.publish != 'false' && env.LIMB_KEYSTORE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v$VERSION"
          APK="limb-vpn-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"

          release_exists() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --silent
          }

          for attempt in $(seq 1 10); do
            if release_exists; then
              break
            fi
            gh release create "$TAG" \
              --title "Limb VPN $VERSION" \
              --notes "Версия $VERSION (сборка ${{ github.run_number }})." && break || true
            sleep $((attempt * 5))
          done

          RELEASE_ID=""
          for attempt in $(seq 1 10); do
            if RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .id); then
              break
            fi
            sleep $((attempt * 5))
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Не удалось получить релиз $TAG"
            exit 1
          fi

          for attempt in $(seq 1 10); do
            if ASSET=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
              --jq ".assets[] | select(.name == \"$APK\") | .name") &&
              [ "$ASSET" = "$APK" ]; then
              echo "Релиз $TAG уже содержит $APK"
              exit 0
            fi
            if gh release upload "$TAG" "$APK"; then
              break
            fi
            sleep $((attempt * 5))
          done

          for attempt in $(seq 1 10); do
            if ASSET=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
              --jq ".assets[] | select(.name == \"$APK\") | .name") &&
              [ "$ASSET" = "$APK" ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Не удалось загрузить $APK в релиз $TAG"
          exit 1
